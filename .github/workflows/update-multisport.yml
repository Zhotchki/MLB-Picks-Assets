name: Update MultiSport forecasts and results
on:
  push:
    branches: [main]
    paths: ['multisport/*.py', 'multisport/*.js', 'multisport/index.html', '.github/workflows/update-multisport.yml']
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: multisport-data
  # A newer cron run supersedes an older guard wait. The fresh run recalculates
  # the same immutable window from current data before any provider request.
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache daily roster and hourly result sources
        uses: actions/cache@v4
        with:
          path: multisport/.runtime
          key: multisport-sources-${{ github.run_id }}
          restore-keys: multisport-sources-
      - name: Verify adapter and forecast tests
        run: |
          node multisport/test_player_view.js
          node multisport/test_eligibility.js
          node multisport/test_validation_view.js
          node multisport/test_slip_view.js
          python -m unittest discover -s multisport -p 'test_*.py'
      - name: Update forecasts with transient retry and diagnostics
        run: python multisport/update_with_retry.py
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multisport-failure-${{ github.run_id }}
          path: multisport/.runtime/update-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve predictions and publish current data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add multisport/data.json multisport/ledger.json multisport/model.json multisport/feed-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh MultiSport forecasts and final results [skip ci]'
          git pull --rebase origin main
          git push origin main
      - name: Plan one guarded pregame follow-up
        id: window_guard
        run: python multisport/window_guard.py >> "$GITHUB_OUTPUT"
      - name: Wait for the planned pregame window
        if: steps.window_guard.outputs.should_wait == 'true'
        run: sleep "${{ steps.window_guard.outputs.wait_seconds }}"
      - name: Refresh at the guarded pregame window
        if: steps.window_guard.outputs.should_wait == 'true'
        run: python multisport/update_with_retry.py
      - name: Publish guarded pregame refresh
        if: steps.window_guard.outputs.should_wait == 'true'
        run: |
          git add multisport/data.json multisport/ledger.json multisport/model.json multisport/feed-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh MultiSport pregame window [skip ci]'
          git pull --rebase origin main
          git push origin main
