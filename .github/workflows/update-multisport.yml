name: Update MultiSport forecasts and results
on:
  push:
    branches: [main]
    paths: ['multisport/update.py', '.github/workflows/update-multisport.yml']
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: multisport-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify adapter and update forecasts
        run: |
          python -m unittest discover -s multisport -p 'test_*.py'
          python multisport/update.py
      - name: Preserve predictions and publish current data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add multisport/data.json multisport/ledger.json multisport/model.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh MultiSport forecasts and final results [skip ci]'
          git pull --rebase origin main
          git push origin main
