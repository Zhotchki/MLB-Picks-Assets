name: Update MultiSport forecasts and results
on:
  push:
    branches: [main]
    paths: ['multisport/*.py', 'multisport/*.js', '.github/workflows/update-multisport.yml']
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: multisport-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache daily roster and hourly result sources
        uses: actions/cache@v4
        with:
          path: multisport/.runtime
          key: multisport-sources-${{ github.run_id }}
          restore-keys: multisport-sources-
      - name: Verify adapter and update forecasts
        run: |
          node multisport/test_player_view.js
          node multisport/test_eligibility.js
          node multisport/test_validation_view.js
          node multisport/test_slip_view.js
          python -m unittest discover -s multisport -p 'test_*.py'
          python multisport/update.py
      - name: Preserve predictions and publish current data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add multisport/data.json multisport/ledger.json multisport/model.json multisport/feed-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh MultiSport forecasts and final results [skip ci]'
          git pull --rebase origin main
          git push origin main
